<html lang="zh-TW">

    <title>心智大作戰｜空間認知｜Step 5.2</title>
    <style>
:root{
  --bg:#061a2b;--bg2:#0b3149;--panel:rgba(255,255,255,.97);--text:#17324d;--muted:#718596;
  --primary:#32a9e8;--primary2:#6ed2ba;--danger:#df5a63;--gold:#f4b942;--line:rgba(26,60,87,.12);
  --shadow:0 24px 60px rgba(1,18,32,.28);
}
*{box-sizing:border-box}
html,body{min-height:100%;margin:0}
body{
  font-family:"Microsoft JhengHei","微軟正黑體","Noto Sans TC",Arial,sans-serif;
  color:var(--text);background:
  radial-gradient(circle at 10% 0%,rgba(110,210,186,.20),transparent 24%),
  radial-gradient(circle at 90% 8%,rgba(50,169,232,.28),transparent 28%),
  linear-gradient(160deg,var(--bg),var(--bg2) 54%,#092238);
  padding:18px; user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overscroll-behavior:none;
}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.14;background-image:radial-gradient(rgba(255,255,255,.8) .55px,transparent .55px);background-size:18px 18px}
.topbar{width:100%;max-width:1040px;margin:0 auto 14px;display:flex;align-items:center;justify-content:space-between;gap:12px;color:white;position:relative;z-index:2}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;letter-spacing:.06em}.brand-mark{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:25px;background:linear-gradient(145deg,#6ed2ba,#32a9e8);box-shadow:0 10px 24px rgba(0,0,0,.22)}
.brand-copy small{display:block;font-size:.66rem;letter-spacing:.18em;opacity:.62}.brand-copy strong{display:block;font-size:1.02rem;margin-top:2px}
.exit-btn{min-height:44px;padding:9px 15px;border:1px solid rgba(255,255,255,.22);border-radius:999px;background:rgba(255,255,255,.09);backdrop-filter:blur(10px);color:white;font-weight:900;cursor:pointer;touch-action:manipulation}
.exit-btn:active{transform:scale(.98)}
.game-card{width:100%;max-width:1240px;margin:0 auto;background:var(--panel);border:1px solid rgba(255,255,255,.75);border-radius:28px;box-shadow:var(--shadow);padding:24px;position:relative;overflow:hidden}
.game-card::before{content:"";position:absolute;width:320px;height:320px;right:-170px;top:-170px;border-radius:50%;background:rgba(50,169,232,.07)}
.game-layout{display:grid;grid-template-columns:minmax(300px,360px) minmax(440px,1fr);gap:30px;align-items:center;position:relative;z-index:1}
.info-area{display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:13px}.eyebrow{font-size:.7rem;letter-spacing:.2em;font-weight:900;color:#1681bb}.title-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.title-row h1{margin:0;font-size:clamp(1.7rem,4vw,2.35rem);letter-spacing:.03em}.game-tag{padding:6px 10px;border-radius:999px;background:#edf7fb;color:#39758f;font-size:.72rem;font-weight:900}
.status-row{display:flex;gap:8px;flex-wrap:wrap}.status-pill{padding:7px 11px;border-radius:999px;background:#f2f7f9;color:#57717e;font-size:.78rem;font-weight:900}.status-pill strong{color:var(--text)}
.instruction{width:100%;padding:17px 17px;border-radius:18px;background:linear-gradient(145deg,#f8fbfd,#eef7fa);border:1px solid #dcebf0;color:var(--text);font-size:1.13rem;line-height:1.55;font-weight:750}.instruction .target-time{display:inline-block;margin-top:8px;color:#1486c3;font-size:clamp(1.7rem,4vw,2.25rem);font-weight:1000;letter-spacing:.03em}
.tips{width:100%;padding:13px 15px;border-radius:16px;background:#fff8e9;border:1px solid #ffe1a1;color:#7e6732;font-size:.86rem;line-height:1.55;font-weight:700}.tips strong{color:#a47712}
.play-area{display:flex;flex-direction:column;align-items:center;gap:16px;width:100%}
.clock-stage{width:min(100%,640px); max-width:640px;aspect-ratio:1/1;display:grid;place-items:center;position:relative;border-radius:28px;background:radial-gradient(circle,#fdfefe 0 52%,#eef8fb 53% 72%,#e3f0f4 73%);box-shadow:inset 0 0 0 1px #d7e8ed,0 18px 40px rgba(16,63,84,.12);}
.clock-stage::before{content:"";position:absolute;inset:6%;border-radius:50%;border:1px dashed rgba(22,129,187,.18)}
.clock-container{position:relative;width:78%;aspect-ratio:1/1;background:#fff;border:8px solid #17324d;border-radius:50%;box-shadow:0 14px 30px rgba(8,36,54,.20),inset 0 0 0 5px #edf6f8;display:none;touch-action:none}
.clock-container::before{content:"";position:absolute;inset:6%;border:1px solid rgba(23,50,77,.10);border-radius:50%}.clock-container::after{content:"";position:absolute;width:18px;height:18px;background:#17324d;border:5px solid #fff;border-radius:50%;top:50%;left:50%;transform:translate(-50%,-50%);z-index:10;box-shadow:0 3px 8px rgba(0,0,0,.18)}
.number{position:absolute;font-size:1.26rem;font-weight:950;color:#597386;transform:translate(-50%,-50%);pointer-events:none}
.hand{position:absolute;bottom:50%;left:50%;transform-origin:bottom center;z-index:5;pointer-events:none}.hour-hand{width:13px;height:24%;background:#17324d;margin-left:-5.5px;border-radius:8px;box-shadow:0 3px 7px rgba(0,0,0,.18)}.minute-hand{width:8px;height:36%;background:#32a9e8;margin-left:-3.5px;border-radius:6px;box-shadow:0 3px 7px rgba(0,0,0,.16)}
.hour-guide{position:absolute;bottom:100%;left:50%;width:0;height:38px;border-left:2px dashed rgba(23,50,77,.30);margin-left:-1px;pointer-events:none}.minute-guide{position:absolute;bottom:100%;left:50%;width:0;height:18px;border-left:2px dashed rgba(50,169,232,.58);margin-left:-1px;pointer-events:none}
.clock-container.is-touching{box-shadow:0 14px 34px rgba(8,36,54,.24),inset 0 0 0 5px #edf6f8,0 0 0 4px rgba(50,169,232,.12)}
.clock-hint{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);font-size:.72rem;color:#88a0ac;font-weight:800;white-space:nowrap}
#result-board{width:100%;padding:16px 18px;background:#effaf5;color:#1d6d51;border-radius:18px;border:1px solid #bee9d7;font-size:1.08rem;font-weight:900;display:none;text-align:center;line-height:1.55}
.btn-group{display:flex;gap:10px;justify-content:center;width:100%;flex-wrap:wrap}.main-action-btn{min-height:54px;padding:13px 24px;font-size:1.08rem;font-weight:950;letter-spacing:.05em;border:0;border-radius:16px;color:white;cursor:pointer;box-shadow:0 10px 22px rgba(14,60,83,.16);display:none;transition:transform .18s,box-shadow .18s;touch-action:manipulation;width:100%;max-width:250px}.main-action-btn:active{transform:translateY(2px);box-shadow:0 5px 12px rgba(14,60,83,.14)}
#btn-start{background:linear-gradient(135deg,#32a9e8,#1486c3);display:block}#btn-submit{background:linear-gradient(135deg,#6ed2ba,#45bd9e)}#btn-next{background:linear-gradient(135deg,#32a9e8,#3a78d1)}
.finish-card{width:100%;max-width:520px;text-align:center}.finish-title{font-size:1.7rem;font-weight:1000;margin-bottom:4px}.score-big{font-size:4rem;line-height:1;font-weight:1000;color:#1486c3;margin:12px 0}.finish-meta{color:#607785;font-weight:800;margin-bottom:18px}.finish-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.finish-actions button{min-height:50px;padding:10px 18px;border:0;border-radius:14px;font-weight:900;color:white;cursor:pointer;touch-action:manipulation}.again{background:#32a9e8}.home{background:#45bd9e}
.footer-note{max-width:1040px;margin:13px auto 0;text-align:center;color:rgba(255,255,255,.55);font-size:.75rem;font-weight:700;position:relative;z-index:2}
@media (max-width:820px){.game-card{max-width:980px}.game-layout{grid-template-columns:1fr}.info-area{text-align:center;align-items:center}.title-row{justify-content:center}.instruction,.tips{max-width:620px}.clock-stage{width:min(88vw,560px)}}
@media (max-width:600px){body{padding:12px}.game-card{padding:18px;border-radius:22px}.topbar{margin-bottom:9px}.brand-mark{width:40px;height:40px;border-radius:12px;font-size:22px}.brand-copy strong{font-size:.92rem}.exit-btn{min-height:40px;padding:7px 12px;font-size:.86rem}.game-layout{gap:20px}.clock-container{width:78%}.instruction{font-size:1rem}.tips{font-size:.8rem}.clock-stage{border-radius:22px}.number{font-size:1.05rem}.clock-container.is-touching{box-shadow:0 14px 34px rgba(8,36,54,.24),inset 0 0 0 5px #edf6f8,0 0 0 4px rgba(50,169,232,.12)}
.clock-hint{font-size:.64rem}}
@media (max-width:380px){.clock-stage{width:min(92vw,420px)}.clock-container{width:80%}.number{font-size:1rem}.hour-hand{width:11px}.minute-hand{width:7px}}
@media (orientation:landscape) and (max-height:620px){body{padding:8px 14px}.topbar{margin-bottom:7px}.game-card{padding:16px}.game-layout{grid-template-columns:minmax(280px,.9fr) minmax(400px,1.1fr);gap:18px}.instruction{font-size:.95rem;padding:12px}.tips{font-size:.76rem;padding:10px}.clock-stage{max-width:470px}.main-action-btn{min-height:46px;padding:10px 18px}.brand-mark{width:38px;height:38px;font-size:21px}}
</style>

<body data-game-id="clock">
  <div class="topbar">
    <div class="brand"><div class="brand-mark" aria-hidden="true"><span></span><span></span><span></span><span></span></div><div class="brand-copy"><small>BRAIN CHALLENGE</small><strong>心智大作戰</strong></div></div>
    <button class="exit-btn" onclick="exitGame()">回大廳</button>
  </div>

  <div class="game-feedback" id="game-feedback" role="status" aria-live="polite"></div>

  <main class="game-card">
    <div class="game-layout">
      <section class="info-area">
        <div class="eyebrow">CHALLENGE 01</div>
        <div class="title-row"><h1>空間認知</h1><span class="game-tag">掌握指針與空間位置</span></div>
        <div class="game-hud">
          <div class="game-hud-row">
            <div class="status-row">
              <div class="status-pill" id="status-bar">進度 <strong>1 / 5</strong></div>
              <div class="status-pill score-pill" id="score-pill-wrap">本關分數 <strong id="score-pill">0</strong></div>
            </div>
          </div>
          <div class="game-progress" aria-label="遊戲進度">
            <span id="game-progress-bar" role="progressbar" aria-valuemin="0" aria-valuemax="5" aria-valuenow="0"></span>
          </div>
        </div>
        <div class="instruction" id="instruction">準備好挑戰你的時間感了嗎？<br>按下開始，看看你能不能精準撥出指定時間。</div>
        <div class="tips"><strong>小提示：</strong>拖曳時針或分針即可調整時間。先抓準，再確認。</div>
      </section>

      <section class="play-area">
        <div class="clock-stage">
          <div class="clock-container" id="clock">
            <div class="hand hour-hand" id="hour-hand"><div class="hour-guide"></div></div>
            <div class="hand minute-hand" id="minute-hand"><div class="minute-guide"></div></div>
            
          </div>
        </div>
        <div class="bc-game-hint">直接拖曳任一指針設定時間</div>
        <div id="result-board"></div>
        <div class="btn-group">
          <button id="btn-start" class="main-action-btn" onclick="startGame()">開始挑戰</button>
          <button id="btn-submit" class="main-action-btn" onclick="submitAnswer()">確認答案</button>
          <button id="btn-next" class="main-action-btn" onclick="nextRound()">下一題</button>
        </div>
      </section>
    </div>
  </main>

  <div class="footer-note">互動科普體驗｜非醫療診斷工具</div>
<script src="brain-config.js"></script>
<script>
        document.addEventListener('contextmenu', e => e.preventDefault());
        
        window.addEventListener("orientationchange", function() {
            setTimeout(() => { window.scrollTo(0, 0); }, 200);
        });

        function exitGame() {
            if (confirm("現在離開的話，目前的進度將不會被儲存喔。確定要回大廳嗎？")) {
                if (window.BrainChallenge) BrainChallenge.navigation.goHome();
                else window.location.href = 'index.html';
            }
        }

        let selectedQuestions = [];
        let currentRoundIndex = 0;
        const GAME_CONFIG = BrainChallengeConfigAPI.getForModule('clock');
        const totalRounds = GAME_CONFIG.rounds; 
        let totalScore = 0;
        let totalTimeMs = 0; 
        let roundStartTime = 0; 
        let hourAngle = 180, minuteAngle = 0;
        let isDragging = false, activeHand = null;

        const clock = document.getElementById('clock');
        const hourHand = document.getElementById('hour-hand');
        const minuteHand = document.getElementById('minute-hand');
        const instruction = document.getElementById('instruction');
        const statusBar = document.getElementById('status-bar');
        const resultBoard = document.getElementById('result-board');
        const scorePill = document.getElementById('score-pill');
        const scorePillWrap = document.getElementById('score-pill-wrap');
        const progressBar = document.getElementById('game-progress-bar');
        const playArea = document.querySelector('.play-area');
        const btnStart = document.getElementById('btn-start');
        const btnSubmit = document.getElementById('btn-submit');
        const btnNext = document.getElementById('btn-next');

        function initClockNumbers() {
            for (let i = GAME_CONFIG.time.hourMin; i <= GAME_CONFIG.time.hourMax; i++) {
                const numDiv = document.createElement('div');
                numDiv.className = 'number'; numDiv.innerText = i;
                const angle = (i * 30 - 90) * (Math.PI / 180);
                numDiv.style.left = `${50 + 42 * Math.cos(angle)}%`;
                numDiv.style.top = `${50 + 42 * Math.sin(angle)}%`;
                clock.appendChild(numDiv);
            }
        }

        function startGame() {
            btnStart.style.display = 'none'; clock.style.display = 'block'; statusBar.style.display = 'block';
            scorePill.innerText = '0';
            BrainChallenge.gameShell.hideFeedback();
            BrainChallenge.gameShell.setProgress(progressBar, 0, totalRounds);
            selectedQuestions = [];
            while (selectedQuestions.length < totalRounds) {
                let h = Math.floor(Math.random() * (GAME_CONFIG.time.hourMax - GAME_CONFIG.time.hourMin + 1)) + GAME_CONFIG.time.hourMin;
                let m = Math.floor(Math.random() * (GAME_CONFIG.time.minuteMax - GAME_CONFIG.time.minuteMin + 1)) + GAME_CONFIG.time.minuteMin;
                let timeText = m === 0 ? `${h} 點整` : (m === 30 ? `${h} 點半` : `${h} 點 ${m} 分`);
                if (!selectedQuestions.some(q => q.hour === h && q.minute === m)) {
                    selectedQuestions.push({ text: timeText, hour: h, minute: m });
                }
            }
            currentRoundIndex = 0; totalScore = 0; totalTimeMs = 0;
            startRound();
        }

        function startRound() {
            statusBar.style.display = 'block';
            statusBar.innerHTML = `進度 <strong>${currentRoundIndex + 1} / ${totalRounds}</strong>`;
            BrainChallenge.gameShell.setProgress(progressBar, currentRoundIndex + 1, totalRounds);
            BrainChallenge.gameShell.hideFeedback();
            playArea.classList.remove('feedback-correct', 'feedback-partial', 'feedback-wrong');
            instruction.innerHTML = `請將時鐘撥到<br><span class="target-time">${selectedQuestions[currentRoundIndex].text}</span>`;
            hourAngle = 180; minuteAngle = 0; updateHandsDisplay();
            resultBoard.style.display = 'none'; btnSubmit.style.display = 'block'; btnNext.style.display = 'none';
            roundStartTime = Date.now();
        }

        function calculatePointerAngle(ex, ey) {
            const rect = clock.getBoundingClientRect();
            let deg = Math.atan2(ey - (rect.top + rect.height/2), ex - (rect.left + rect.width/2)) * 180 / Math.PI + 90;
            return (deg + 360) % 360;
        }

        function getShortestAngleDiff(a1, a2) {
            let diff = Math.abs((a1 - a2 + 360) % 360);
            return diff > 180 ? 360 - diff : diff;
        }

        clock.addEventListener('pointerdown', (e) => {
            if (btnSubmit.style.display === 'none') return;
            isDragging = true;
            clock.setPointerCapture(e.pointerId);
            const pointerAngle = calculatePointerAngle(e.clientX, e.clientY);
            activeHand = (getShortestAngleDiff(pointerAngle, hourAngle) <= getShortestAngleDiff(pointerAngle, minuteAngle)) ? 'hour' : 'minute';
            if (activeHand === 'hour') hourAngle = pointerAngle; else minuteAngle = pointerAngle;
            updateHandsDisplay();
            clock.classList.add('is-touching');
        });

        document.addEventListener('pointermove', (e) => {
            if (!isDragging || !activeHand) return;
            const pointerAngle = calculatePointerAngle(e.clientX, e.clientY);
            if (activeHand === 'hour') hourAngle = pointerAngle; else minuteAngle = pointerAngle;
            updateHandsDisplay();
        });
        
        document.addEventListener('pointerup', () => { isDragging = false; activeHand = null; clock.classList.remove('is-touching'); });

        function updateHandsDisplay() {
            hourHand.style.transform = `rotate(${hourAngle}deg)`;
            minuteHand.style.transform = `rotate(${minuteAngle}deg)`;
        }

        function submitAnswer() {
            totalTimeMs += Date.now() - roundStartTime;
            const q = selectedQuestions[currentRoundIndex];
            const targetHourAngle = ((q.hour % 12) * 30) + (q.minute / 60 * 30);
            const targetMinuteAngle = q.minute * 6;
            const diffHour = getShortestAngleDiff(hourAngle, targetHourAngle);
            const diffMin = getShortestAngleDiff(minuteAngle, targetMinuteAngle);

            let roundScore = 0, msg = "";
            if (diffHour <= GAME_CONFIG.angleTolerance.hour && diffMin <= GAME_CONFIG.angleTolerance.minute) { roundScore = GAME_CONFIG.scoring.fullScore; msg = "兩根指針都在正確位置。"; }
            else if (diffHour <= GAME_CONFIG.angleTolerance.hour || diffMin <= GAME_CONFIG.angleTolerance.minute) { roundScore = GAME_CONFIG.scoring.partialScore; msg = "一根指針位置正確。"; }
            else { roundScore = GAME_CONFIG.scoring.zeroScore; msg = "調整指針後，再確認一次。"; }

            totalScore += roundScore;
            scorePill.innerText = totalScore;
            BrainChallenge.gameShell.animateScore(scorePillWrap);
            const feedbackType = roundScore === 100 ? 'correct' : (roundScore === 50 ? 'partial' : 'wrong');
            playArea.classList.remove('feedback-correct', 'feedback-partial', 'feedback-wrong');
            void playArea.offsetWidth;
            playArea.classList.add(`feedback-${feedbackType}`);
            BrainChallenge.gameShell.feedback({
                type: feedbackType,
                title: feedbackType === 'correct' ? '位置正確' : feedbackType === 'partial' ? '接近目標' : '再看一次位置',
                message: msg,
                duration: 1100
            });
            resultBoard.innerHTML = `本題得分：<strong>${roundScore} 分</strong><br><span style="font-size:1rem; font-weight:normal;">${msg}</span>`;
            resultBoard.style.display = 'block'; btnSubmit.style.display = 'none';
            btnNext.style.display = 'block'; btnNext.innerText = currentRoundIndex === totalRounds - 1 ? "看最終結果" : "下一題";
        }

        function nextRound() {
            playArea.classList.remove('feedback-correct', 'feedback-partial', 'feedback-wrong');
            currentRoundIndex++;
            if (currentRoundIndex < totalRounds) startRound(); else showFinalResult();
        }

        function showFinalResult() {
            BrainChallenge.audio?.play?.('complete');
            BrainChallenge.gameShell.setProgress(progressBar, totalRounds, totalRounds);
            BrainChallenge.gameShell.hideFeedback();
            statusBar.style.display = 'none';
            instruction.innerHTML = `
                <div class="finish-card">
                    <div class="finish-title">本關完成</div>
                    <div>你的空間認知挑戰結果</div>
                    <div class="score-big">${Math.round(totalScore / totalRounds)}</div>
                    <div class="finish-meta">平均得分</div>
                </div>`;
            clock.parentElement.style.display = 'none';
            btnNext.style.display = 'none';

            const avgScore = Math.round(totalScore / totalRounds);
            const totalSeconds = Math.floor(totalTimeMs / 1000);
            const timeString = totalSeconds >= 60 ? `${Math.floor(totalSeconds/60)}分${totalSeconds%60}秒` : `${totalSeconds}秒`;

            const gameRecord = {
                gameName: "空間認知",
                playerName: sessionStorage.getItem('currentPlayerName') || "訪客",
                score: avgScore,
                totalSeconds: totalSeconds,
                timeText: timeString,
                age: localStorage.getItem('currentUserAge') || "未設定",
                timestamp: new Date().toLocaleString()
            };
            if (window.BrainChallenge) { BrainChallenge.scores.save(gameRecord); } else { let history = JSON.parse(localStorage.getItem('game_history') || "[]"); history.push(gameRecord); localStorage.setItem('game_history', JSON.stringify(history)); }

            resultBoard.innerHTML = `
                <div style="font-size:1.08rem;margin-bottom:4px;">本關平均得分</div>
                <div style="font-size:2.35rem;color:#1486c3;font-weight:1000;">${avgScore} 分</div>
                <div style="margin:4px 0 14px;color:#607785;font-size:.92rem;">作答總時間：<strong>${timeString}</strong></div>
                <div class="finish-actions">
                    <button class="again" onclick="location.reload()">再挑戰一次</button>
                    <button class="home" onclick="BrainChallenge.navigation.goHome()">回到大廳</button>
                </div>`;
            resultBoard.style.display = 'block';
        }
        initClockNumbers();
    </script>
<script src="brain-viewport.js"></script>
</body>
</html>

<script src="island-integration.js"></script>
