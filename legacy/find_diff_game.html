<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>心智大作戰｜視覺注意力</title>
<link rel="stylesheet" href="brain-responsive.css">
<link rel="stylesheet" href="brain-game-shell.css">
<link rel="stylesheet" href="brain-object-art.css">
<link rel="stylesheet" href="attention-layout.css">
<script src="brain-games.js"></script>
<script src="brain-audio.js"></script>
<script src="brain-feedback.js"></script>
<script src="brain-core.js"></script>
<link rel="stylesheet" href="brain-motion.css">
<link rel="stylesheet" href="brain-game-theme.css">
<link rel="stylesheet" href="brain-game-frame.css">
</head>
<body class="attention-page" data-game-id="attention" data-phase="ready">
<header class="topbar">
  <div class="brand"><div class="brand-mark" aria-hidden="true"><span></span><span></span><span></span><span></span></div><div class="brand-copy"><small>BRAIN CHALLENGE</small><strong>心智大作戰</strong></div></div>
  <button class="exit-btn" onclick="exitGame()">回大廳</button>
</header>
<div class="game-feedback" id="game-feedback" role="status" aria-live="polite"></div>
<main class="game-card">
  <section class="info-area" aria-label="本關說明與進度">
    <div class="title-group"><div class="eyebrow">CHALLENGE 02 · 觀察與發現</div><h1>視覺注意力</h1></div>
    <div class="instruction" id="instruction" role="status" aria-live="polite">比較左右兩張圖，找出換了物件的格子。<small>在右邊「找錯圖」點選答案。</small></div>
    <div class="game-hud">
      <div class="status-row"><span class="status-pill" id="status-bar">準備開始</span><span class="status-pill score-pill" id="score-pill-wrap">本題 <strong id="score-pill">100</strong> 分</span></div>
      <div class="game-progress"><span id="game-progress-bar" role="progressbar" aria-label="已完成題數" aria-valuemin="0" aria-valuemax="3" aria-valuenow="0"></span></div>
    </div>
  </section>
  <section class="play-area" id="play-area" aria-label="找錯遊戲">
    <div class="ready-panel" id="ready-panel">
      <div class="ready-art" id="ready-art" aria-hidden="true"></div>
      <h2>看看哪裡不一樣？</h2>
      <p>熟悉的生活物件，考驗你的觀察力。<br>左右相同位置，仔細比一比。</p>
      <button id="btn-start" class="main-action-btn" onclick="initGame()" disabled>正在準備圖片…</button>
      <p id="asset-status" role="status" class="asset-status"></p>
    </div>
    <div class="find-stage" id="find-stage" hidden>
      <div class="grid-pair" id="game-container">
        <section class="grid-wrapper"><div class="grid-title"><span class="board-badge">A</span><h2>基準圖</h2><small>先看這邊</small></div><div class="grid-scroll"><div id="grid-a" class="grid-area" aria-label="基準圖"></div></div></section>
        <section class="grid-wrapper target-board"><div class="grid-title target"><span class="board-badge">B</span><h2>找錯圖</h2><small>點選不同的格子</small></div><div class="grid-scroll"><div id="grid-b" class="grid-area" aria-label="找錯圖"></div></div></section>
      </div>
      <div class="round-footer">
        <p id="round-hint" class="round-hint">不必搶快，依自己的步調觀察。</p>
        <div class="result-board" id="result-board" role="status" hidden></div>
        <button id="btn-next" class="main-action-btn" onclick="nextRound()" hidden>下一題 →</button>
      </div>
    </div>
    <div class="final-panel" id="final-panel" hidden></div>
  </section>
</main>
<footer class="footer-note">互動科普體驗｜非醫療診斷工具</footer>
<script src="brain-config.js"></script>
<script src="brain-assets.js"></script>
<script src="attention-game.js"></script>
</body></html>

<script src="island-integration.js"></script>
